# TEST-005: reglas de ZAP (zap-baseline.py / zap-api-scan.py, -c este archivo).
#
# Formato (tab-separated): <rule id>	<action>	(url regex opcional)	(comentario opcional)
# action: IGNORE (no reporta) | WARN (reporta, no falla) | FAIL (reporta y falla) | INFO
#
# El quality gate real de este proyecto (scripts/zap-report-gate.py) solo mira riesgo HIGH
# en el reporte XML final, independientemente del "action" de esta tabla - este archivo
# sirve para documentar POR QUÉ un hallazgo específico (de cualquier riesgo) es un falso
# positivo o un riesgo aceptado conocido, no para ocultar hallazgos reales sin justificar.
#
# Cada entrada nueva debe agregarse solo después de correr el scan real y confirmar
# manualmente que el hallazgo es un falso positivo (no "porque molesta").

# Ejemplo (sin activar todavía, referencia de formato):
# 10021	IGNORE	.*	X-Content-Type-Options ya está presente vía SecurityConfig (headers()); confirmado con curl -I

# === Frontend (zap-baseline.py contra la imagen Docker de nginx, TEST-005) ===

# Timestamp Disclosure - Unix: los "timestamps" detectados en el bundle JS minificado son
# constantes criptográficas SHA-256 (ej. 1116352408 = 0x428a2d98, la primera constante K de
# SHA-256), no fechas reales. Vienen de la librería de generación de code_challenge PKCE que
# usa keycloak-js. Confirmado manualmente decodificando los valores exactos reportados.
10096	IGNORE	.*	Falso positivo verificado: constantes SHA-256 en el bundle de PKCE (keycloak-js), no timestamps reales

# Modern Web Application: clasificación informativa de ZAP para SPAs (detecta que la app usa
# routing del lado del cliente), no es una vulnerabilidad.
10109	IGNORE	.*	Clasificación informativa de ZAP para SPAs, no es un hallazgo de seguridad

# Storable and Cacheable Content: el cacheo de los assets estáticos versionados por hash
# (index-*.js/css) es intencional y deseable (Vite genera un hash distinto por contenido en
# cada build, así que cachear agresivamente es seguro y mejora performance).
10049	IGNORE	.*	Cacheo intencional de assets estáticos versionados por hash de contenido (Vite)

# CSP: Failure to Define Directive with No Fallback: la CSP de nginx.conf define
# object-src/base-uri/frame-ancestors pero deliberadamente NO define "default-src" (ni
# connect-src/script-src/frame-src explícitos) - ver el comentario en frontend/nginx.conf.
# Se probó con "default-src 'self'" y rompió el login por completo (bloqueaba el iframe de
# silent-check-sso hacia Keycloak, origen distinto); confirmado con un login real de
# Playwright contra el contenedor antes y después del cambio. Los orígenes de
# Keycloak/backend son configurables por entorno (VITE_KEYCLOAK_URL/VITE_API_BASE_URL) y
# nginx.conf es un archivo estático - listar orígenes fijos rompería en cualquier entorno
# donde difieran.
10055	IGNORE	.*	default-src omitido a propósito: rompe el login (iframe cross-origin de Keycloak) - ver frontend/nginx.conf

# Cross-Origin-Embedder-Policy Header Missing: COEP (require-corp) exige que TODO recurso
# cross-origin declare CORP/CORS explícitamente, incluyendo el iframe cross-origin que
# Keycloak usa para el login real (no solo silent-check-sso). Agregarlo rompería el flujo de
# login completo, no solo el silent-check. COEP es relevante para aislar SharedArrayBuffer/
# timers de alta precisión (Spectre-class), que esta app no usa.
90004	IGNORE	.*	Rompería el iframe cross-origin de login de Keycloak; no aplica al modelo de amenaza de esta app (no usa SharedArrayBuffer)

# === Backend (zap-api-scan.py contra /v3/api-docs, TEST-005) ===

# DOM XSS Active Scan Rule: necesita lanzar un navegador real (Selenium/Firefox) para
# ejecutar JS y detectar XSS del lado del cliente - la imagen zaproxy/zap-stable no trae
# navegador instalado, así que esta regla cuelga intentando arrancarlo y termina crasheando
# el daemon de ZAP entero (confirmado: el scan se detuvo en seco con "Connection refused"
# justo después de "DomXssScanRule ... Reaper thread starting", sin generar ningún reporte).
# Además es conceptualmente inaplicable: el target es una API REST (JSON), no una página que
# renderiza DOM - no hay superficie de "DOM XSS" que analizar en /v3/api-docs ni en los
# endpoints de /api/**.
40026	IGNORE	.*	Requiere un navegador real (no disponible en la imagen zap-stable) y no aplica a una API REST sin DOM; crasheaba el daemon de ZAP

# HTTP Only Site (Medium): correcto - docker-compose.dev.yml es explícitamente un entorno de
# desarrollo local sin TLS (ver CLAUDE.md secciones 3/16). En una arquitectura real la
# terminación TLS ocurre en un reverse proxy/load balancer delante del backend (nginx,
# ALB, Cloudflare), no en el propio Spring Boot - riesgo aceptado para dev/local, a revisar
# cuando exista un despliegue de staging/producción real con su propio proxy (INFRA-004).
10106	IGNORE	.*	Entorno de desarrollo local sin TLS a propósito; la terminación TLS es responsabilidad de un reverse proxy en despliegues reales (pendiente INFRA-004)

# Unexpected Content-Type was returned: falso positivo en 3 casos verificados manualmente -
# (1) swagger-ui/index.html es intencionalmente HTML (la UI de Swagger, no un endpoint JSON);
# (2) las URLs con "?aaa=bbb" y "?class.module.classLoader.DefaultAssertionStatus=nonsense"
# son fuzzing del propio ZAP contra la raíz "/", que no tiene ningún @Controller mapeado en
# este backend (Spring Boot devuelve su Whitelabel Error Page en HTML, comportamiento normal
# para una ruta no mapeada, no un endpoint de la API).
100001	IGNORE	.*	Falso positivo: swagger-ui/index.html es HTML a propósito; "/" no es un endpoint de la API (Whitelabel Error Page normal de Spring Boot)
