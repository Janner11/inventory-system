# CICD-003: DoD del ticket pide explícitamente "sonar-project.properties commiteado".
# El análisis real de este proyecto corre vía el plugin Gradle (org.sonarqube,
# build.gradle.kts — ./gradlew sonar), que NO lee este archivo (el plugin Gradle
# configura el scanner por código, con el bloque `sonar { properties { ... } }`). Este
# archivo es el equivalente para quien prefiera invocar el sonar-scanner CLI directo
# (fuera de Gradle) contra este proyecto — mantenido en sincronía manual con
# build.gradle.kts.
sonar.projectKey=inventario-backend
sonar.projectName=Inventario Backend
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=build/classes/java/main
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
sonar.qualitygate.wait=true
