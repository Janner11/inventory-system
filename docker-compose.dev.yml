name: inventario

networks:
  inventario-network:
    name: inventario-network
    driver: bridge

volumes:
  postgres_data:
  keycloak_data:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
  alertmanager_data:

services:
  postgres:
    image: postgres:16
    container_name: inventario-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventario}
      POSTGRES_USER: ${POSTGRES_USER:-inventario_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventario_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inventario_user} -d ${POSTGRES_DB:-inventario}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - inventario-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: inventario-keycloak
    restart: unless-stopped
    command: start-dev --health-enabled=true --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-inventario_user}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-inventario_pass}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8080"
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - inventario-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: inventario-backend:dev
    container_name: inventario-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: ${BACKEND_PORT:-8081}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-inventario}
      DB_USERNAME: ${POSTGRES_USER:-inventario_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-inventario_pass}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8080/realms/inventario}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:8080/realms/inventario/protocol/openid-connect/certs}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # OBS-001: instrumentacion automatica via OpenTelemetry Java Agent (JAVA_TOOL_OPTIONS
      # ya fijado en el Dockerfile). Alloy expone su receptor OTLP en :4317 desde INFRA-003.
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-inventario-backend}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4317}
      # El SDK/agente de OTel usa "http/protobuf" por defecto si no se especifica; el
      # receptor otelcol.receiver.otlp de Alloy en :4317 es grpc-only, asi que hay que
      # forzarlo explicitamente o el agente falla con "Connection reset" (ver Detalle de
      # OBS-001 en CLAUDE.md).
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-otlp}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.version=1.0.0,deployment.environment=dev}
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      alloy:
        condition: service_started
    networks:
      - inventario-network

  prometheus:
    image: prom/prometheus:latest
    container_name: inventario-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      # Habilita el endpoint remote_write usado por Alloy para reenviar metricas OTLP
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - inventario-network

  cadvisor:
    # OBS-004 (dashboard "Infraestructura"): metricas de CPU/RAM/red por contenedor
    # (container_cpu_usage_seconds_total, container_memory_usage_bytes,
    # container_network_*_bytes_total), con label "name" = nombre del contenedor.
    # La imagen trae su propio HEALTHCHECK (a diferencia de prometheus/grafana/alloy
    # en este archivo, que no traen wget/curl/sh) - queda "healthy" automaticamente.
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: inventario-cadvisor
    restart: unless-stopped
    ports:
      - "${CADVISOR_PORT:-8085}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - inventario-network

  alertmanager:
    # Pineado a v0.27.0 (en vez de :latest) por reproducibilidad, igual que loki/tempo abajo.
    image: prom/alertmanager:v0.27.0
    container_name: inventario-alertmanager
    restart: unless-stopped
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9093/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - inventario-network

  loki:
    # Pineado a 2.9.6 (no :latest): la serie 3.x mas reciente cambia el esquema de
    # storage/wal y ademas la imagen queda sin shell/wget, lo que impide un healthcheck
    # CMD-SHELL. 2.9.x es la version estable y documentada de la serie usada en el resto
    # del stack (Grafana Explore, provisioning) y sigue trayendo busybox (wget/sh).
    image: grafana/loki:2.9.6
    container_name: inventario-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - inventario-network

  tempo:
    # Pineado a 2.6.1: la serie 3.x reestructura el config (arquitectura basada en Kafka,
    # backend-scheduler/backend-worker) y ya no acepta el esquema classic
    # ingester/compactor/storage.trace.local usado aqui. 2.6.1 es la version estable,
    # ampliamente documentada, con la que se implemento esta migracion.
    image: grafana/tempo:2.6.1
    container_name: inventario-tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo-config.yml
    volumes:
      - ./observability/tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3200/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - inventario-network

  alloy:
    # Sin HEALTHCHECK de contenedor: la imagen grafana/alloy no incluye wget/curl (solo
    # /usr/bin/sh), igual que prometheus/grafana en este mismo archivo. Su disponibilidad
    # se valida manualmente vía la UI en :12345 (ver README).
    image: grafana/alloy:latest
    container_name: inventario-alloy
    restart: unless-stopped
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    volumes:
      - ./observability/alloy/alloy-config.alloy:/etc/alloy/config.alloy:ro
    ports:
      - "${ALLOY_OTLP_GRPC_PORT:-4317}:4317"
      - "${ALLOY_OTLP_HTTP_PORT:-4318}:4318"
      - "${ALLOY_UI_PORT:-12345}:12345"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - inventario-network

  grafana:
    image: grafana/grafana:latest
    container_name: inventario-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - inventario-network
