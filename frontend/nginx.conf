server_tokens off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta no encontrada como archivo estático cae a index.html
    # (React Router maneja el enrutamiento del lado del cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    # TEST-005 (ZAP baseline scan): SAMEORIGIN en vez de DENY — Keycloak (SEC-003,
    # onLoad: 'check-sso') carga public/silent-check-sso.html en un iframe del MISMO
    # origen para el silent SSO check; DENY bloquea esa carga incluso siendo same-origin,
    # rompiendo silenciosamente la re-autenticación automática de usuarios con sesión
    # Keycloak ya activa. Nunca se había detectado porque toda verificación previa de
    # login (E2E/manual) corrió contra `npm run dev` (Vite), no contra esta imagen Docker
    # con nginx — ver "Detalle de TEST-005" en CLAUDE.md.
    add_header X-Frame-Options "SAMEORIGIN" always;
    # frame-ancestors 'self' es el equivalente moderno de X-Frame-Options SAMEORIGIN;
    # object-src/base-uri reducen superficie de ataque sin depender de los orígenes de
    # Keycloak/backend (configurables por entorno vía VITE_*, no fijos en este archivo
    # estático). Deliberadamente SIN "default-src" (ni connect-src/frame-src/script-src
    # explícitos): default-src actúa como fallback de TODAS las directivas no listadas,
    # así que "default-src 'self'" bloquea implícitamente frame-src/connect-src hacia
    # Keycloak/el backend (orígenes distintos) — se probó primero con "default-src 'self'"
    # y rompió el login por completo (el iframe de silent-check-sso ya no podía navegar a
    # Keycloak); confirmado con Playwright contra este mismo contenedor antes de quitarlo.
    add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
}
