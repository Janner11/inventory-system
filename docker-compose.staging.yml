name: inventario-staging

# INFRA-004: entorno de staging — replica el stack completo de docker-compose.dev.yml
# (misma topología de servicios, mismos archivos de configuración de observabilidad,
# mismo realm.json de Keycloak, fuente única de verdad — ADR-008) con dos diferencias
# deliberadas frente a dev:
#   1. `backend`/`frontend` usan `image:` (artefacto ya construido y publicado en GHCR
#      por el pipeline CI/CD), no `build:` (a diferencia de docker-compose.dev.yml, que
#      construye desde el código fuente local en cada `up`).
#   2. Ninguna variable de credenciales/URLs tiene un valor por defecto trivial
#      (`${VAR:-inventario_pass}` como en dev) — todas son `${VAR}` sin fallback, así
#      que si falta `.env.staging` el arranque falla explícitamente en vez de correr
#      con secretos de desarrollo. Ver `.env.staging.example` para el listado completo.
#
# Puertos de host: por defecto usan un rango distinto al de docker-compose.dev.yml
# (backend 8082 en vez de 8081, Postgres 5433 en vez de 5432, etc. — ver
# .env.staging.example) para poder levantar staging en la misma máquina sin detener el
# stack de desarrollo. En CI (runner efímero) esto no importa, pero en verificación
# local es lo que permite correr ambos stacks a la vez sin colisión de puertos.

networks:
  inventario-staging-network:
    name: inventario-staging-network
    driver: bridge

volumes:
  staging_postgres_data:
  staging_keycloak_data:
  staging_prometheus_data:
  staging_grafana_data:
  staging_loki_data:
  staging_tempo_data:
  staging_alertmanager_data:

services:
  postgres:
    image: postgres:16
    container_name: inventario-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - inventario-staging-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: inventario-staging-keycloak
    restart: unless-stopped
    command: start-dev --health-enabled=true --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      # A diferencia de dev (KC_HOSTNAME=localhost fijo), en staging el hostname público
      # es configurable — debe coincidir con KEYCLOAK_ISSUER_URI/VITE_KEYCLOAK_URL para
      # que el claim "iss" del JWT sea el mismo sin importar desde dónde se pida el token
      # (mismo mecanismo que dev, sección 6 de CLAUDE.md, solo que aquí el valor no está
      # hardcodeado a "localhost").
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      KC_HOSTNAME_PORT: ${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - staging_keycloak_data:/opt/keycloak/data
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - inventario-staging-network

  backend:
    # Imagen ya construida y publicada (CICD-001), no build local — a diferencia de
    # docker-compose.dev.yml. BACKEND_IMAGE compone GITHUB_REPOSITORY + VERSION tal
    # como pide el ticket (ghcr.io/${GITHUB_REPOSITORY}/backend:${VERSION}); ver
    # .env.staging.example para cómo se arma ese valor y cómo apuntarlo a una imagen
    # local para verificación sin depender de GHCR.
    image: ${BACKEND_IMAGE}
    container_name: inventario-staging-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-inventario}/protocol/openid-connect/certs
      # SEC-007: Keycloak Admin REST API (KeycloakAdminClient) - red interna de Docker.
      KEYCLOAK_ADMIN_BASE_URI: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-inventario}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      SPRING_PROFILES_ACTIVE: staging
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      OTEL_SERVICE_NAME: inventario-backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: service.version=${VERSION},deployment.environment=staging
    ports:
      - "${BACKEND_PORT:-8082}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      alloy:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - inventario-staging-network

  frontend:
    # Imagen ya construida y publicada (CICD-001); las variables VITE_* ya están
    # horneadas en el bundle desde el build (Vite las lee en build-time, no en
    # runtime — ver frontend/Dockerfile) así que no se pasan como variables de entorno
    # del contenedor, solo como --build-arg al construir la imagen (ver
    # .env.staging.example y "Cómo construir las imágenes" en docs/staging.md).
    image: ${FRONTEND_IMAGE}
    container_name: inventario-staging-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8090}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - inventario-staging-network

  prometheus:
    image: prom/prometheus:latest
    container_name: inventario-staging-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - staging_prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    networks:
      - inventario-staging-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: inventario-staging-cadvisor
    restart: unless-stopped
    ports:
      - "${CADVISOR_PORT:-8086}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - inventario-staging-network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: inventario-staging-alertmanager
    restart: unless-stopped
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - staging_alertmanager_data:/alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9094}:9093"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9093/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - inventario-staging-network

  # OBS-005: mismo receptor local de webhooks que dev — tampoco hay un servicio real de
  # notificaciones (Slack/email) en staging, así que Alertmanager necesita el mismo
  # target real y offline para poder entregar alertas de verdad.
  alert-webhook-receiver:
    image: python:3.12-alpine
    container_name: inventario-staging-alert-webhook-receiver
    restart: unless-stopped
    command: ["python3", "/app/webhook-receiver.py"]
    volumes:
      - ./observability/alertmanager/webhook-receiver.py:/app/webhook-receiver.py:ro
    ports:
      - "${ALERT_WEBHOOK_PORT:-5002}:5001"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - inventario-staging-network

  loki:
    image: grafana/loki:2.9.6
    container_name: inventario-staging-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - staging_loki_data:/loki
    ports:
      - "${LOKI_PORT:-3101}:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - inventario-staging-network

  tempo:
    image: grafana/tempo:2.6.1
    container_name: inventario-staging-tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo-config.yml
    volumes:
      - ./observability/tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - staging_tempo_data:/var/tempo
    ports:
      - "${TEMPO_PORT:-3201}:3200"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3200/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - inventario-staging-network

  alloy:
    image: grafana/alloy:latest
    container_name: inventario-staging-alloy
    restart: unless-stopped
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    volumes:
      - ./observability/alloy/alloy-config.alloy:/etc/alloy/config.alloy:ro
    ports:
      - "${ALLOY_OTLP_GRPC_PORT:-4417}:4317"
      - "${ALLOY_OTLP_HTTP_PORT:-4418}:4318"
      - "${ALLOY_UI_PORT:-12346}:12345"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - inventario-staging-network

  grafana:
    # DOC-001: pineado por el mismo motivo que docker-compose.dev.yml — "latest" resolvía
    # a un build cuyo módulo de provisioning fallaba en duro contra la misma config de
    # datasources que ya funcionaba.
    image: grafana/grafana:11.6.0
    container_name: inventario-staging-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - staging_grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - inventario-staging-network
