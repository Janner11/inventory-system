name: Performance Test

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:

  k6-load-test:
    name: k6 Load Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # SONARQUBE_DB_PASSWORD no tiene default (CICD-003, a proposito) - Compose valida
      # el archivo completo antes de levantar/parsear nada, asi que CUALQUIER
      # "docker compose -f docker-compose.dev.yml ..." de este job falla sin esto (el
      # "up -d" inicial, pero tambien los "logs" de diagnostico - encontrado real en CI,
      # un paso que solo puso este env en el primer comando dejaba los demas rotos).
      # Un valor cualquiera alcanza: este job nunca arranca sonarqube/sonarqube-db.
      SONARQUBE_DB_PASSWORD: ci-placeholder-unused
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build backend
        working-directory: backend
        run: ./gradlew build -x test

      # docker-compose.dev.yml usado como aproximacion de "staging" para este job (mismo
      # patron que security-scan.yml); migrar a docker-compose.staging.yml (INFRA-004,
      # ya implementado) sigue pendiente como mejora futura, ver CLAUDE.md.
      - name: Start Postgres, Keycloak and backend (docker-compose.dev.yml)
        run: docker compose -f docker-compose.dev.yml up -d postgres keycloak backend

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8081/actuator/health | grep -q '"status":"UP"' && echo "backend UP" && exit 0
            sleep 5
          done
          echo "backend did not become healthy in time"
          docker compose -f docker-compose.dev.yml logs backend keycloak
          exit 1

      - name: Wait for Keycloak readiness
        # El backend puede reportarse "UP" (solo valida su propia conexion a Postgres)
        # mientras Keycloak todavia esta terminando de arrancar - k6 hace login real
        # contra Keycloak en su setup() y encontro esta carrera real en CI
        # ("connection reset by peer" en el primer POST a /protocol/openid-connect/token,
        # exit code 107 de k6). Se espera explicitamente por /health/ready de Keycloak
        # (mismo endpoint que ya usa su propio HEALTHCHECK en docker-compose.dev.yml),
        # no solo por el backend.
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/health/ready | grep -q '"status": "UP"' && echo "keycloak UP" && exit 0
            sleep 5
          done
          echo "keycloak did not become ready in time"
          docker compose -f docker-compose.dev.yml logs backend keycloak
          exit 1

      - name: Run k6 load test
        run: |
          mkdir -p tests/performance/results
          # grafana/k6 corre como usuario no-root dentro del contenedor - en un runner
          # Linux real no puede escribir en el directorio recien creado sin esto (mismo
          # problema y mismo fix que zaproxy/zap-stable en security-scan.yml -
          # "permission denied" al abrir load-test-summary.json/load-test-results.json,
          # encontrado real en CI).
          chmod -R 777 tests/performance/results
          docker run --network host --rm \
            -v "$(pwd)/tests/performance:/scripts:rw" \
            -e KEYCLOAK_URL=http://localhost:8080 \
            -e BASE_URL=http://localhost:8081 \
            grafana/k6 run \
            --summary-export=/scripts/results/load-test-summary.json \
            --out json=/scripts/results/load-test-results.json \
            /scripts/load-test.js

      - name: Dump backend/keycloak logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs backend keycloak

      - name: Upload k6 report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-load-test-report
          path: tests/performance/results/
