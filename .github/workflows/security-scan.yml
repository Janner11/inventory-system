name: Security Scan

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:

  zap-baseline-frontend:
    name: OWASP ZAP Baseline Scan (Frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: docker build -t inventario-frontend:zap frontend/

      - name: Start frontend container
        run: docker run -d --name zap-target-frontend -p 8090:8080 inventario-frontend:zap

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8090/ > /dev/null && echo "frontend UP" && exit 0
            sleep 2
          done
          echo "frontend did not become available in time"; exit 1

      - name: Pull ZAP
        run: docker pull zaproxy/zap-stable

      - name: Run ZAP Baseline Scan
        run: |
          mkdir -p zap-reports
          # zaproxy/zap-stable corre como usuario no-root (uid 1000, "zap") dentro del
          # contenedor - en un runner Linux real de GitHub Actions ese uid no coincide con
          # el dueno del directorio recien creado (el usuario "runner"), y ZAP no puede
          # escribir sus reportes ahi ("AccessDeniedException /zap/wrk/baseline-report.html",
          # encontrado real en un run de CI - no reproducible en Docker Desktop/macOS, que
          # traduce permisos de otra forma). chmod 777 es el workaround estandar documentado
          # para este escenario exacto.
          chmod -R 777 zap-reports
          # zap-ignore-rules.conf se copia DENTRO de zap-reports/ antes de montar (en vez de
          # un segundo -v aparte) porque montar un archivo suelto dentro de un directorio ya
          # montado como volumen falla en Docker Desktop/macOS (virtiofs) — copiarlo evita
          # depender de si el runner tiene el mismo problema.
          cp zap-ignore-rules.conf zap-reports/zap-ignore-rules.conf
          # zap-baseline.py agrega "-addonupdate" al arrancar el daemon de ZAP a menos que
          # se le pase "-silent" via -z (ver docker/zap-api-scan.py en zaproxy/zaproxy) - sin
          # esto, ZAP intenta descargar/instalar cualquier addon mas nuevo del marketplace
          # antes de exponer su API, lo que puede consumir el timeout completo de arranque
          # (600s por defecto) y tumbar el job con "Failed to connect to ZAP after 600
          # seconds" sin que sea un fallo real del scan (encontrado real en CI).
          docker run --network host --rm \
            -v "$(pwd)/zap-reports:/zap/wrk/:rw" \
            zaproxy/zap-stable zap-baseline.py \
            -t http://localhost:8090/ \
            -c zap-ignore-rules.conf \
            -r baseline-report.html \
            -x baseline-report.xml \
            -J baseline-report.json \
            -z "-silent" \
            -I
          # zap-baseline.py sale con codigo != 0 en WARN/FAIL segun sus propias reglas
          # (-I evita que WARN por si solo tumbe el job); el quality gate real de HIGH
          # (paso siguiente) es el que decide si el pipeline falla.

      - name: Quality gate — 0 vulnerabilidades HIGH
        run: python3 scripts/zap-report-gate.py zap-reports/baseline-report.xml

      - name: Stop frontend container
        if: always()
        run: docker rm -f zap-target-frontend || true

      - name: Upload ZAP baseline report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report
          path: zap-reports/

  zap-api-scan-backend:
    name: OWASP ZAP API Scan (Backend)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # SONARQUBE_DB_PASSWORD no tiene default (CICD-003, a proposito) - Compose valida
      # el archivo completo antes de levantar/parsear nada, asi que CUALQUIER
      # "docker compose -f docker-compose.dev.yml ..." de este job falla sin esto (no
      # solo el "up -d" inicial, tambien los "logs" de diagnostico que corren en fallos -
      # encontrado real en CI: un fix que solo cubria el primer comando dejaba los demas
      # rotos). Un valor cualquiera alcanza: este job nunca arranca sonarqube/sonarqube-db.
      SONARQUBE_DB_PASSWORD: ci-placeholder-unused
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build backend
        working-directory: backend
        run: ./gradlew build -x test

      - name: Start Postgres, Keycloak and backend (docker-compose.dev.yml)
        run: docker compose -f docker-compose.dev.yml up -d postgres keycloak backend

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8081/actuator/health | grep -q '"status":"UP"' && echo "backend UP" && exit 0
            sleep 5
          done
          echo "backend did not become healthy in time"
          docker compose -f docker-compose.dev.yml logs backend keycloak
          exit 1

      - name: Pull ZAP
        run: docker pull zaproxy/zap-stable

      - name: Run ZAP API Scan (OpenAPI spec)
        run: |
          mkdir -p zap-reports
          # Ver el mismo chmod en el job "OWASP ZAP Baseline Scan (Frontend)" de este
          # archivo - zaproxy/zap-stable corre como uid 1000 no-root dentro del contenedor.
          chmod -R 777 zap-reports
          cp zap-ignore-rules.conf zap-reports/zap-ignore-rules.conf
          # -z "-silent": ver el mismo comentario en el job "OWASP ZAP Baseline Scan
          # (Frontend)" de este archivo - evita que ZAP se auto-actualice al arrancar y
          # agote el timeout de 600s antes de exponer su API ("Failed to connect to ZAP
          # after 600 seconds", encontrado real en CI, no relacionado a ningun cambio de
          # codigo de la app).
          docker run --network host --rm \
            -v "$(pwd)/zap-reports:/zap/wrk/:rw" \
            zaproxy/zap-stable zap-api-scan.py \
            -t http://localhost:8081/v3/api-docs \
            -f openapi \
            -c zap-ignore-rules.conf \
            -r api-scan-report.html \
            -x api-scan-report.xml \
            -J api-scan-report.json \
            -z "-silent" \
            -I

      - name: Quality gate — 0 vulnerabilidades HIGH
        run: python3 scripts/zap-report-gate.py zap-reports/api-scan-report.xml

      - name: Dump backend/keycloak logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs backend keycloak

      - name: Upload ZAP API scan report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-api-scan-report
          path: zap-reports/

  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    # Encontrado real en CI (2026-07): incluso con NVD_API_KEY configurada, la primera
    # sincronizacion del historico completo del NVD se canceló dos veces por timeout (30
    # min primero, 90 min despues) sin completar - el log ya no mostraba "API Key was not
    # provided", asi que la key SI se estaba usando, simplemente la sincronizacion en vivo
    # es demasiado lenta/pesada para bloquear un PR con ella. Se desacopla: este job NUNCA
    # sincroniza en vivo (dependencyCheckAutoUpdate=false, siempre usa el cache ya
    # restaurado); el unico que sincroniza de verdad es el workflow programado
    # "dependency-check-update.yml" (semanal, sin nadie esperando, con su propio timeout
    # generoso). Por eso "Cache NVD database" usa actions/cache/restore (solo lectura, sin
    # el auto-save al final del job que trae actions/cache normal) - si este job guardara
    # su propia copia sin sincronizar, podria "ganarle" el slot de cache de la semana al
    # job programado antes de que este alcance a escribir los datos realmente actualizados.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # Solo lectura (restore-keys ya cae al cache de la semana mas reciente disponible,
      # escrito por dependency-check-update.yml) - nunca escribe, ver comentario arriba.
      - name: Restore NVD database from cache
        uses: actions/cache/restore@v4
        with:
          path: backend/build/dependency-check-data
          key: nvd-db-${{ github.run_id }}-unused
          restore-keys: nvd-db-

      - name: Run OWASP Dependency-Check (sin sincronizar — usa el cache ya restaurado)
        working-directory: backend
        run: ./gradlew dependencyCheckAnalyze -PdependencyCheckAutoUpdate=false

      - name: Upload Dependency-Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: backend/build/reports/dependency-check/
