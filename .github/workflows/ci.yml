name: CI

# CICD-001: trigger obligatorio del ticket — push a develop/main + PR contra develop/main
# (antes solo cubría push a develop; se agregó "push a main" para que el job docker-push,
# que solo debe correr en un merge real a main, tenga un evento que lo dispare).
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Necesario para que el job docker-push pueda autenticarse contra GHCR con el
# GITHUB_TOKEN por defecto del workflow (sin necesitar un PAT manual) — ver
# CONTRIBUTING.md, sección "Secrets requeridos en CI".
permissions:
  contents: read
  packages: write

jobs:

  # --- 1/2/3. Checkout + Setup JDK 21 + Maven Build ---------------------------------
  # El ticket describe "Maven Build"/"mvn package" — el proyecto usa Gradle (sin pom.xml
  # en ningún lado del repo, ver sección 11 de CLAUDE.md), mismo criterio de adaptación
  # ya usado en TEST-003/TEST-005 (Maven → Gradle en toda la documentación del backlog).
  backend-build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build (skip tests)
        working-directory: backend
        run: ./gradlew build -x test

  # --- 4. Unit Tests + JaCoCo -------------------------------------------------------
  unit-tests:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    needs: backend-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run unit tests
        working-directory: backend
        # TEST-001 (ampliación): jacocoTestCoverageVerification hace la cobertura de
        # ProductService/StockService "obligatoria" (85% líneas/65% branches) — un fallo
        # de cobertura ya rompe este job, que es el quality gate real y activo hoy
        # (Validaciones del ticket: "Quality gate bloquea merge si..." — SonarQube, más
        # abajo, todavía no tiene servidor real desplegado, ver job "sonarqube").
        run: ./gradlew test --tests "com.inventario.unit.*" jacocoTestReport jacocoTestCoverageVerification

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: backend/build/test-results/test/

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: backend/build/reports/jacoco/test/html/

  # --- 5. SonarQube Analysis ---------------------------------------------------------
  # CICD-003: no hay ningún servidor SonarQube persistente/hosteado para este proyecto
  # académico (ni presupuesto para SonarCloud). En vez de dejar este job condicionado a
  # un secret que nunca se configuraría, se levanta un SonarQube Community efímero como
  # "service container" del propio job — vive solo durante esta corrida, se destruye al
  # terminar — y se le aplica el mismo Quality Gate ("Inventario Quality Gate": Coverage
  # >= 70%, 0 new bugs, 0 new vulnerabilities, <= 10 new code smells, duplicación <= 3%,
  # ver docs/cicd/sonarqube.md) vía la API REST antes de analizar. Si en el futuro se
  # dispone de un servidor real y persistente, `secrets.SONAR_TOKEN`/`SONAR_HOST_URL`
  # sobrescriben este comportamiento (ver step "Analyze").
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: backend-build
    services:
      sonarqube-db:
        image: postgres:16
        env:
          POSTGRES_DB: sonarqube
          POSTGRES_USER: sonarqube
          POSTGRES_PASSWORD: sonarqube
        options: >-
          --health-cmd "pg_isready -U sonarqube"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      sonarqube:
        image: sonarqube:lts-community
        env:
          SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
          SONAR_JDBC_USERNAME: sonarqube
          SONAR_JDBC_PASSWORD: sonarqube
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # El contexto "secrets" no está permitido en un "if:" de step según actionlint
      # (conservador — no puede verificar en tiempo de lint qué secrets existen); se
      # resuelve acá, dentro de un "run:" (donde sí es válido), y se expone como output
      # para que los steps siguientes usen "steps.check-sonar-secret.outputs..." en su
      # "if:" en su lugar.
      - name: Check for a persistent SONAR_TOKEN secret
        id: check-sonar-secret
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: echo "configured=${{ env.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Wait for ephemeral SonarQube to be UP
        if: steps.check-sonar-secret.outputs.configured != 'true'
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:9000/api/system/status | grep -q '"status":"UP"'; then
              echo "SonarQube UP"; exit 0
            fi
            sleep 5
          done
          echo "SonarQube no llegó a UP a tiempo"; exit 1

      - name: Provision ephemeral SonarQube (admin password, project, Quality Gate, token)
        if: steps.check-sonar-secret.outputs.configured != 'true'
        run: |
          curl -sf -u admin:admin -X POST "http://localhost:9000/api/users/change_password" \
            -d "login=admin" -d "password=${{ github.run_id }}CiTemp!" -d "previousPassword=admin"
          AUTH="admin:${{ github.run_id }}CiTemp!"

          curl -sf -u "$AUTH" -X POST "http://localhost:9000/api/projects/create" \
            -d "name=Inventario Backend" -d "project=inventario-backend"

          curl -sf -u "$AUTH" -X POST "http://localhost:9000/api/qualitygates/create" \
            -d "name=Inventario Quality Gate"
          curl -sf -u "$AUTH" -X POST "http://localhost:9000/api/qualitygates/create_condition" \
            -d "gateName=Inventario Quality Gate" -d "metric=coverage" -d "op=LT" -d "error=70"
          curl -sf -u "$AUTH" -X POST "http://localhost:9000/api/qualitygates/create_condition" \
            -d "gateName=Inventario Quality Gate" -d "metric=new_bugs" -d "op=GT" -d "error=0"
          curl -sf -u "$AUTH" -X POST "http://localhost:9000/api/qualitygates/create_condition" \
            -d "gateName=Inventario Quality Gate" -d "metric=new_vulnerabilities" -d "op=GT" -d "error=0"
          curl -sf -u "$AUTH" -X POST "http://localhost:9000/api/qualitygates/create_condition" \
            -d "gateName=Inventario Quality Gate" -d "metric=new_code_smells" -d "op=GT" -d "error=10"
          curl -sf -u "$AUTH" -X POST "http://localhost:9000/api/qualitygates/create_condition" \
            -d "gateName=Inventario Quality Gate" -d "metric=duplicated_lines_density" -d "op=GT" -d "error=3"
          curl -sf -u "$AUTH" -X POST "http://localhost:9000/api/qualitygates/select" \
            -d "gateName=Inventario Quality Gate" -d "projectKey=inventario-backend"

          TOKEN_JSON=$(curl -sf -u "$AUTH" -X POST "http://localhost:9000/api/user_tokens/generate" -d "name=ci-${{ github.run_id }}")
          echo "EPHEMERAL_SONAR_TOKEN=$(echo "$TOKEN_JSON" | python3 -c 'import json,sys;print(json.load(sys.stdin)["token"])')" >> "$GITHUB_ENV"

      - name: Run tests with coverage + SonarQube analysis (sonar.qualitygate.wait=true)
        working-directory: backend
        env:
          # Prioriza un servidor real persistente si está configurado (secrets); si no,
          # usa el SonarQube efímero recién provisionado en este mismo job.
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'http://localhost:9000' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN || env.EPHEMERAL_SONAR_TOKEN }}
        run: ./gradlew test jacocoTestReport sonar

  # --- 8. Integration Tests (Testcontainers) -----------------------------------------
  # Testcontainers en CI: los runners ubuntu-latest de GitHub Actions ya traen Docker
  # instalado y accesible por defecto (Docker-outside-of-Docker vía el daemon del propio
  # runner) — no hace falta ninguna configuración adicional de Docker-in-Docker para que
  # Testcontainers funcione, ya verificado por TEST-002 (SecurityIntegrationTest, con su
  # propio KeycloakContainer + PostgreSQLContainer). Ver CONTRIBUTING.md para más detalle
  # sobre este "Caso de Error" del ticket.
  integration-tests:
    name: Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: backend-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run integration tests
        working-directory: backend
        run: ./gradlew test --tests "com.inventario.integration.*"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: backend/build/test-results/test/

  # --- 9. API Tests (RestAssured) -----------------------------------------------------
  api-tests:
    name: API Tests (RestAssured)
    runs-on: ubuntu-latest
    needs: backend-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run API tests
        working-directory: backend
        run: ./gradlew test --tests "com.inventario.api.*"

      - name: Upload test results (XML)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: backend/build/test-results/test/

      # TEST-003: reporte HTML legible (RestAssured/JUnit) de ProductApiTest/StockApiTest/
      # AuthApiTest/ContractTest, distinto del XML de arriba (pensado para CI).
      - name: Upload test results (HTML report)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-html-report
          path: backend/build/reports/tests/test/

  # --- 6. Build Docker image backend (+ frontend) -------------------------------------
  # Valida que ambos Dockerfiles siguen construyendo correctamente en cada PR/push, y dejan
  # las imágenes listas (mismo runner, mismo daemon Docker local) para el job siguiente
  # (staging-e2e-security), sin necesitar push a ningún registry todavía.
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: backend-build
    outputs:
      backend-image: ${{ steps.tags.outputs.backend-image }}
      frontend-image: ${{ steps.tags.outputs.frontend-image }}
      backend-image-base: ${{ steps.tags.outputs.backend-image-base }}
      frontend-image-base: ${{ steps.tags.outputs.frontend-image-base }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags (GHCR exige el nombre del repo en minúsculas)
        id: tags
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          {
            echo "backend-image-base=ghcr.io/${REPO_LOWER}/backend"
            echo "frontend-image-base=ghcr.io/${REPO_LOWER}/frontend"
            echo "backend-image=ghcr.io/${REPO_LOWER}/backend:${{ github.sha }}"
            echo "frontend-image=ghcr.io/${REPO_LOWER}/frontend:${{ github.sha }}"
          } >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: docker build -t "${{ steps.tags.outputs.backend-image }}" backend/

      - name: Build frontend image
        # Build-args apuntando al stack de staging (job siguiente) — VITE_* se hornean en
        # el bundle en build-time (frontend/Dockerfile, TEST-005), no en runtime.
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=http://localhost:8082/api \
            --build-arg VITE_KEYCLOAK_URL=http://localhost:8180 \
            --build-arg VITE_KEYCLOAK_REALM=inventario \
            --build-arg VITE_KEYCLOAK_CLIENT_ID=inventario-frontend \
            -t "${{ steps.tags.outputs.frontend-image }}" frontend/

      - name: Trivy — backend image (0 CRITICAL)
        # CICD-004: gate real, no solo verificacion manual. Un CRITICAL conocido
        # (CVE-2026-22732, spring-security-web) queda documentado como riesgo aceptado en
        # backend/.trivyignore (ver CLAUDE.md, "Detalle de CICD-004") - todo lo demas
        # bloquea el pipeline de verdad.
        run: |
          mkdir -p trivy-reports
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$(pwd)/backend/.trivyignore:/tmp/.trivyignore:ro" \
            -v "$(pwd)/trivy-reports:/reports" \
            aquasec/trivy image --severity CRITICAL --exit-code 1 \
            --ignorefile /tmp/.trivyignore \
            --format json --output /reports/backend-trivy.json \
            "${{ steps.tags.outputs.backend-image }}"

      - name: Trivy — frontend image (0 CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$(pwd)/trivy-reports:/reports" \
            aquasec/trivy image --severity CRITICAL --exit-code 1 \
            --format json --output /reports/frontend-trivy.json \
            "${{ steps.tags.outputs.frontend-image }}"

      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-reports
          path: trivy-reports/

      - name: Save images to a single tarball
        run: docker save -o /tmp/staging-images.tar "${{ steps.tags.outputs.backend-image }}" "${{ steps.tags.outputs.frontend-image }}"

      - name: Upload image tarball
        uses: actions/upload-artifact@v4
        with:
          name: staging-images
          path: /tmp/staging-images.tar
          retention-days: 1

  # --- 7/9/11. Deploy staging + E2E Tests (Playwright) + Security Scan (OWASP ZAP) ----
  # Adaptación explícita: cada "job" de GitHub Actions corre en una VM aislada nueva — un
  # `docker compose up` en un job no es alcanzable desde otro job distinto sin un entorno
  # externo persistente (un servidor/cluster de staging real, que este proyecto académico
  # no tiene). "Deploy staging" y "correr pruebas contra ese staging ya desplegado" viven
  # por lo tanto en el MISMO job (pasos secuenciales, cada uno con su propio nombre claro
  # para la trazabilidad que pide el ticket), en vez de jobs separados que no podrían
  # comunicarse entre sí en este runner efímero.
  staging-e2e-security:
    name: Deploy Staging + E2E + Security Scan
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download image tarball
        uses: actions/download-artifact@v4
        with:
          name: staging-images
          path: /tmp

      - name: Load Docker images
        run: docker load -i /tmp/staging-images.tar

      - name: Prepare .env.staging (valores no-secretos, solo para este runner efímero)
        run: |
          cp .env.staging.example .env.staging
          sed -i "s#^BACKEND_IMAGE=.*#BACKEND_IMAGE=${{ needs.docker-build.outputs.backend-image }}#" .env.staging
          sed -i "s#^FRONTEND_IMAGE=.*#FRONTEND_IMAGE=${{ needs.docker-build.outputs.frontend-image }}#" .env.staging
          sed -i "s/CAMBIAR_password_staging_real/ci-staging-pg-pass/" .env.staging
          sed -i "s/CAMBIAR_admin_password_staging_real/ci-staging-admin-pass/" .env.staging
          sed -i "s/CAMBIAR_client_secret_staging_real/inventario-backend-secret/" .env.staging
          sed -i "s/CAMBIAR_grafana_password_staging_real/ci-staging-grafana-pass/" .env.staging

      - name: Deploy staging (docker-compose.staging.yml)
        run: ./scripts/start-staging.sh

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox

      - name: Run Playwright E2E tests against staging
        working-directory: frontend
        env:
          BASE_URL: http://localhost:8090
        run: npx playwright test

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/

      - name: Upload Playwright screenshots and videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: frontend/test-results/

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: frontend/allure-results/

      - name: OWASP ZAP baseline scan (frontend de staging)
        # Baseline liviano contra el staging ya desplegado, como pide este pipeline
        # (stage 11). El escaneo completo (baseline + API scan + Dependency-Check,
        # TEST-005) sigue viviendo en security-scan.yml, con sus propios triggers.
        run: |
          mkdir -p zap-reports
          cp zap-ignore-rules.conf zap-reports/zap-ignore-rules.conf
          docker run --network host --rm \
            -v "$(pwd)/zap-reports:/zap/wrk/:rw" \
            zaproxy/zap-stable zap-baseline.py \
            -t http://localhost:8090/ \
            -c zap-ignore-rules.conf \
            -r baseline-report.html \
            -x baseline-report.xml \
            -J baseline-report.json \
            -I

      - name: Security quality gate — 0 vulnerabilidades HIGH
        run: python3 scripts/zap-report-gate.py zap-reports/baseline-report.xml

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-staging-baseline-report
          path: zap-reports/

      - name: Dump staging logs on failure
        if: failure()
        run: docker compose --env-file .env.staging -f docker-compose.staging.yml logs --tail=200

      - name: Tear down staging
        if: always()
        run: docker compose --env-file .env.staging -f docker-compose.staging.yml down -v

  # --- 12. Docker push (solo en push a main) ------------------------------------------
  docker-push:
    name: Push Docker Images to GHCR
    runs-on: ubuntu-latest
    needs: [docker-build, unit-tests, integration-tests, api-tests, staging-e2e-security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download image tarball
        uses: actions/download-artifact@v4
        with:
          name: staging-images
          path: /tmp

      - name: Load Docker images
        run: docker load -i /tmp/staging-images.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GHCR_TOKEN (PAT con scope write:packages) es opcional — si no está configurado
          # como secret del repo, se usa el GITHUB_TOKEN automático del workflow (ya tiene
          # permiso de escritura de paquetes vía "permissions: packages: write" arriba).
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      # Nunca se sube ":latest" sin un tag de versión específico junto a él (sección 14 de
      # CLAUDE.md, "Prohibiciones") — la imagen ya trae el tag de versión exacto
      # (el SHA del commit, calculado por el job docker-build); acá solo se le agrega
      # "latest" además, para consumidores que quieren la versión más reciente de main.
      - name: Tag and push backend image
        run: |
          docker tag "${{ needs.docker-build.outputs.backend-image }}" "${{ needs.docker-build.outputs.backend-image-base }}:latest"
          docker push "${{ needs.docker-build.outputs.backend-image }}"
          docker push "${{ needs.docker-build.outputs.backend-image-base }}:latest"

      - name: Tag and push frontend image
        run: |
          docker tag "${{ needs.docker-build.outputs.frontend-image }}" "${{ needs.docker-build.outputs.frontend-image-base }}:latest"
          docker push "${{ needs.docker-build.outputs.frontend-image }}"
          docker push "${{ needs.docker-build.outputs.frontend-image-base }}:latest"
