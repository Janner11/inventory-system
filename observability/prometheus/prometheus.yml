global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # SEC-004: /actuator/prometheus ahora exige el scope "actuator:view" (antes publico,
  # exponia metricas de negocio - inventory_value, products_critical, stock_movements,
  # OBS-004 - sin autenticacion). Prometheus se autentica con client_credentials real
  # contra Keycloak usando su soporte nativo de scrape con OAuth2 (>= 2.27), reutilizando
  # el service account ya habilitado del client "inventario-backend" (mismo secret que
  # el resto del proyecto usa para pruebas, keycloak/realm.json) en vez de crear un
  # client dedicado solo para esto.
  - job_name: inventario-backend
    metrics_path: /actuator/prometheus
    oauth2:
      client_id: inventario-backend
      client_secret: inventario-backend-secret
      token_url: http://keycloak:8080/realms/inventario/protocol/openid-connect/token
    static_configs:
      - targets: ["backend:8081"]

  # OBS-002: self-monitoring del colector OTLP (salud del pipeline: colas de
  # exportacion, spans/logs aceptados vs. fallidos por exporter). Alloy expone
  # sus metricas Prometheus-compatibles en /metrics (no en la ruta OTLP).
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  # OBS-004: metricas de CPU/RAM/red por contenedor (dashboard "Infraestructura").
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
