global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: inventario-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8081"]

  # OBS-002: self-monitoring del colector OTLP (salud del pipeline: colas de
  # exportacion, spans/logs aceptados vs. fallidos por exporter). Alloy expone
  # sus metricas Prometheus-compatibles en /metrics (no en la ruta OTLP).
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  # OBS-004: metricas de CPU/RAM/red por contenedor (dashboard "Infraestructura").
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
